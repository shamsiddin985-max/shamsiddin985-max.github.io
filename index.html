<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Для Сафины ❤️</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; overflow:hidden;
    font-family: Georgia, "Times New Roman", serif;
    background: radial-gradient(circle at 50% 25%, #fff0f4 0, #f9cbd8 38%, #b65b78 100%);
    color:#5a1830; display:flex; align-items:center; justify-content:center;
  }
  .glow{position:fixed;inset:0;background:radial-gradient(circle,rgba(255,255,255,.45),transparent 55%);pointer-events:none}
  .card{
    position:relative; width:min(92vw,620px); padding:48px 30px;
    text-align:center; border:1px solid rgba(255,255,255,.65);
    border-radius:30px; background:rgba(255,255,255,.24);
    backdrop-filter:blur(14px); box-shadow:0 25px 70px rgba(77,10,35,.25);
  }
  .heart{font-size:58px; animation:pulse 1.8s infinite}
  h1{font-size:clamp(42px,10vw,72px);margin:10px 0;color:#7c163d}
  .lead{font-size:clamp(23px,5vw,31px);line-height:1.35;margin:20px auto;max-width:500px}
  .date{font-size:18px;margin:22px 0 6px;opacity:.9}
  .place{font-size:20px;font-weight:bold}
  .buttons{display:flex;justify-content:center;gap:14px;margin-top:32px;flex-wrap:wrap}
  button{
    border:0;border-radius:999px;padding:15px 27px;font-size:18px;
    cursor:pointer;transition:.25s;box-shadow:0 8px 20px rgba(92,17,45,.18)
  }
  #yes{background:#8d1946;color:white}
  #yes:hover{transform:scale(1.06)}
  #no{background:rgba(255,255,255,.7);color:#7c163d}
  .answer{display:none;font-size:25px;line-height:1.45;margin-top:26px;animation:fade .5s}
  .petals span{position:fixed;top:-30px;font-size:22px;animation:fall linear infinite;opacity:.75}
  @keyframes pulse{50%{transform:scale(1.12)}}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="glow"></div>
<div class="petals">
  <span style="left:8%;animation-duration:8s">♡</span><span style="left:22%;animation-duration:11s;animation-delay:2s">♥</span>
  <span style="left:39%;animation-duration:9s;animation-delay:1s">♡</span><span style="left:58%;animation-duration:12s;animation-delay:4s">♥</span>
  <span style="left:76%;animation-duration:10s;animation-delay:3s">♡</span><span style="left:91%;animation-duration:13s">♥</span>
</div>

<main class="card">
  <div class="heart">❤️</div>
  <h1>Сафина</h1>
  <p class="lead">Я просто хотел сказать тебе:<br><strong>«Люблю тебя. Пойдём на свидание, моя принцесса?»</strong></p>
  <div class="date">Сегодня, 16 августа 2026</div>
  <div class="place">✨ Романтический ресторан в центре ✨</div>

  <div class="buttons">
    <button id="yes">Да, пойду с тобой ❤️</button>
    <button id="no">Мне нужно подумать 🙈</button>
  </div>

  <div class="answer" id="answer"></div>
</main>

<script>
const answer = document.getElementById('answer');
document.getElementById('yes').onclick = () => {
  answer.style.display = 'block';
  answer.innerHTML = 'Тогда решено! 🥰<br>Сегодня у нас свидание. Я буду ждать тебя ❤️';
};
document.getElementById('no').onclick = () => {
  answer.style.display = 'block';
  answer.innerHTML = 'Хорошо, я подожду… 🌹<br>Но знай: приглашение всё ещё в силе ❤️';
};
</script>
</body>
</html>
